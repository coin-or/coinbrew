---
# Regenerates README.md of a COIN-OR project with its .coin-or/generate_readme
# script, which uses .coin-or/config.yml and scripts/generate_readme of this
# repository. Projects call it from .github/workflows/readme.yml:
#
#   on:
#     push:
#       branches: ['master', 'stable/*']
#       paths: ['.coin-or/config.yml', '.coin-or/generate_readme']
#     pull_request:
#       paths: ['README.md']
#     schedule:
#       - cron: '0 6 * * 1'
#     workflow_dispatch:
#   permissions:
#     contents: write
#   jobs:
#     readme:
#       uses: coin-or/coinbrew/.github/workflows/generate-readme.yml@master
#
# What it does depends on the event that triggered the caller:
#  - push, workflow_dispatch: regenerate README.md of the branch and commit it
#    if it changed.
#  - schedule: the same for master and the latest stable/* branch, so that
#    changes of scripts/generate_readme here reach the projects.
#  - pull_request: check that README.md, which the pull request changes, is
#    what generate_readme produces. README.md must not be edited directly.
# Commits pushed with the workflow's token do not trigger other workflows.

name: Generate README

on:
  workflow_call:
    inputs:
      mode:
        description: auto (depends on the event, see above), check, or commit
        type: string
        default: auto
      coinbrew-ref:
        description: Version of coinbrew whose scripts/generate_readme is used
        type: string
        default: master
      version:
        description: Version to put in the README (default the branch name)
        type: string
        default: ''

jobs:
  readme:
    name: Generate README
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository_owner == 'coin-or'
    steps:
      - name: Checkout coinbrew
        uses: actions/checkout@v6
        with:
          repository: coin-or/coinbrew
          ref: ${{ inputs.coinbrew-ref }}
          path: coinbrew
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          path: project
          fetch-depth: 0
      - name: Generate README
        working-directory: project
        env:
          COINBREW_HOME: ${{ github.workspace }}/coinbrew
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Writes README.md for version $1 (master or stable/x.y)
          generate() {
            COIN_VERSION_OVERRIDE="${VERSION:-$1}" bash .coin-or/generate_readme > ../README.md.new
            mv ../README.md.new README.md
          }

          if [ "$MODE" = auto ]; then
            case "$EVENT" in
              pull_request) MODE=check ;;
              *) MODE=commit ;;
            esac
          fi

          if [ "$MODE" = check ]; then
            if [ ! -f .coin-or/generate_readme ]; then
              echo "There is no .coin-or/generate_readme, nothing to check."
              exit 0
            fi
            version=${BASE_REF:-$REF_NAME}
            generate "$version"
            if ! git diff --quiet -- README.md; then
              echo "::error file=README.md::README.md is generated by .coin-or/generate_readme from .coin-or/config.yml (and scripts/generate_readme of coin-or/coinbrew). Please make the changes there instead of in README.md. The differences between README.md and the generated one are below."
              git diff -- README.md
              exit 1
            fi
            echo "README.md is up to date."
            exit 0
          fi

          if [ "$EVENT" = schedule ]; then
            latest_stable=$(git branch -r --list 'origin/stable/*' | sed 's|^ *origin/||' | sort -V | tail -1)
            branches="master $latest_stable"
          else
            branches=$REF_NAME
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for branch in $branches; do
            git checkout -q -B "$branch" "origin/$branch"
            if [ ! -f .coin-or/generate_readme ]; then
              echo "$branch: there is no .coin-or/generate_readme."
              continue
            fi
            generate "$branch"
            if git diff --quiet -- README.md; then
              echo "$branch: README.md is up to date."
              continue
            fi
            git diff --stat -- README.md
            git commit -q -m "README: regenerate with generate_readme" -- README.md
            git push -q origin "HEAD:$branch"
            echo "$branch: README.md regenerated and pushed."
          done
